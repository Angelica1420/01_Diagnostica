name: CI - Verificación de Evaluación Diagnóstica

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  commitlint:
    name: ✍️ Verificar Convención de Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar Commitlint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional
          echo 'module.exports = {extends: ["@commitlint/config-conventional"]}' > commitlint.config.js
      - name: Validar mensajes de commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} || npx commitlint --last --verbose

  build:
    name: ⚙️ Compilar Firmware (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      
      - name: Compilar Bloque 1 (GPIO)
        run: pio run -d bloque_1
      
      - name: Compilar Bloque 2 (ADC)
        run: pio run -d bloque_2
